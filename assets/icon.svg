  <!--
    Winki Studio app icon (Beta Step 38).

    Source of truth for the mark's geometry and palette is
    `src/renderer/widgets/app-shell/ui/AppLogo.tsx` — keep the two in sync.

    The dark rounded-square backdrop is deliberate, not decoration: the mark is
    a set of light pastel-neon strokes, which disappear against a light Windows
    taskbar or a light macOS dock. Giving the icon its own dark container makes
    it legible on any background, which is why virtually every shipped app icon
    has one.
  -->
