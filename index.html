<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' media: data: blob: https:; media-src 'self' media: blob: https:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>VideoStudio</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('ai_video_studio_theme');
          var preference =
            stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'dark';
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          if (resolved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (error) {
          /* Dark is default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
